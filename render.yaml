services:
  - type: web
    name: ipihrs-chc
    runtime: docker
    plan: free
    buildCommand: docker build -t ipihrs-chc .
    startCommand: docker run -p 10000 ipihrs-chc
    envVars:
      - key: PHP_VERSION
        value: "8.2"
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://healthcaresurvey.cc.cd
      - key: DATABASE_URL
        fromDatabase:
          name: HealtCare-DB
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: HealtCare-DB
          property: host
      - key: DB_PORT
        fromDatabase:
          name: HealtCare-DB
          property: port
      - key: DB_NAME
        fromDatabase:
          name: HealtCare-DB
          property: database
      - key: DB_USER
        fromDatabase:
          name: HealtCare-DB
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: HealtCare-DB
          property: password
      - key: SESSION_SECURE_COOKIE
        value: "1"

databases:
  - name: HealtCare-DB
    plan: free
    databaseName: healthcare_3op3
    user: healthcare_3op3_user
