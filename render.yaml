services:
  - type: web
    name: ipihrs-chc
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --no-interaction --no-progress
    startCommand: vendor/bin/render-php-apache2
    envVars:
      - key: PHP_VERSION
        value: "8.2"
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://ipihrs-chc.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ipihrs-chc-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: ipihrs-chc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ipihrs-chc-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ipihrs-chc-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ipihrs-chc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ipihrs-chc-db
          property: password
      - key: SESSION_SECURE_COOKIE
        value: "1"

databases:
  - name: ipihrs-chc-db
    plan: free
    databaseName: ipihrs_chc
    user: ipihrs_chc_user
